version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=production-secret-aether-erp
      - DATABASE_URL=file:./dev.db
    volumes:
      - backend-db:/app/prisma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-db:
